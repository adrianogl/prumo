name: PRumo
options:
  bundleIdPrefix: dev.aglv
  deploymentTarget:
    macOS: "26.0"
packages:
  PRumoKit:
    path: PRumoKit
targets:
  PRumo:
    type: application
    platform: macOS
    sources:
      - path: PRumo
    dependencies:
      - package: PRumoKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.aglv.prumo
        INFOPLIST_FILE: PRumo/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: PRumo/Resources/PRumo.entitlements
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        SWIFT_VERSION: "6.0"
schemes:
  PRumo:
    build:
      targets:
        PRumo: all
