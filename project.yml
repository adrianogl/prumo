name: PRumo
options:
  bundleIdPrefix: dev.aglv
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    MARKETING_VERSION: 0.3.0
    CURRENT_PROJECT_VERSION: 4
packages:
  PRumoKit:
    path: PRumoKit
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.99.1
targets:
  PRumo:
    type: application
    platform: macOS
    sources:
      - path: PRumo
    dependencies:
      - package: PRumoKit
      - package: SwiftTerm
      - target: PRumoWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.aglv.prumo
        INFOPLIST_FILE: PRumo/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: PRumo/Resources/PRumo.entitlements
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PRumoWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: PRumoWidget
      - path: PRumo/Views/Brand/Wordmark.swift
      - path: PRumo/Views/Brand/BrandColors.swift
      - path: PRumo/Views/Brand/StatusColors.swift
    dependencies:
      - package: PRumoKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.aglv.prumo.widget
        INFOPLIST_FILE: PRumoWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: PRumoWidget/PRumoWidget.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        SWIFT_VERSION: "6.0"
schemes:
  PRumo:
    build:
      targets:
        PRumo: all
